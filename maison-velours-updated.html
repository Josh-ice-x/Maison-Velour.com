<!DOCTYPE html>
<html lang="en">
<head>
  
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maison Velours — Discreet, considered shopping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Maison Velours v2 design system ---------- */
:root {
  --ink: #241726;
  --mute: #756474;
  --surface: #fbf6f4;
  --card: #fff;
  --accent: #e8b4bc;
  --gold: #c9a15a;
  --sale: #c6425e;
  --line: rgba(36, 23, 38, .10);
  --shadow: 0 16px 40px rgba(36, 23, 38, .10);
  --radius: 16px
}
html[data-theme="dark"] {
  --ink: #f7edf3;
  --mute: #b9a9b5;
  --surface: #17121a;
  --card: #211a24;
  --line: rgba(255, 255, 255, .11);
  --gold: #d8b76e;
  --accent: #b97886;
  --sale: #e46b84
}
* {
  box-sizing: border-box
}
html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  max-width: 100vw;
  scroll-behavior: smooth
}
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--surface);
  color: var(--ink);
  transition: background .25s, color .25s
}
button, input, textarea, select {
  font: inherit
}
button {
  cursor: pointer
}
[hidden] {
  display: none!important
}
a {
  color: inherit;
  text-decoration: none
}
h1, h2, h3 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 600
}
.icon {
  width: 18px;
  height: 18px;
  display: inline-block;
  vertical-align: middle;
  flex: none
}
.icon.sm {
  width: 15px;
  height: 15px
}
.icon.lg {
  width: 22px;
  height: 22px
}
#topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  width: 100%;
  z-index: 50;
  box-shadow: 0 2px 18px rgba(36, 23, 38, .05)
}
#main {
  padding-top: 132px
}
#marquee {
  background: var(--ink);
  color: var(--surface);
  padding: 7px 0;
  overflow: hidden;
  white-space: nowrap
}
.track {
  display: flex;
  width: max-content;
  animation: marquee 24s linear infinite
}
@keyframes marquee {
  0% {
    transform: translateX(0)
  }
  100% {
    transform: translateX(-50%)
  }
}
.track span {
  font-size: 11px;
  letter-spacing: .45px;
  padding: 0 30px;
  display: inline-flex;
  gap: 8px;
  align-items: center
}
header {
  background: color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line)
}
.header-row {
  max-width: 1180px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 20px 9px;
  gap: 12px
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: Georgia, serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .2px
}
.logo-mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: linear-gradient(145deg, var(--ink), #6c4d61);
  display: grid;
  place-items: center;
  color: var(--surface);
  box-shadow: 0 7px 18px rgba(36, 23, 38, .18)
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px
}
.icon-btn {
  position: relative;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: grid;
  place-items: center
}
.icon-btn:hover {
  border-color: var(--gold);
  background: var(--surface)
}
#cart-count {
  position: absolute;
  top: -6px;
  right: -5px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  background: var(--sale);
  color: #fff;
  border-radius: 99px;
  font-size: 9px;
  display: grid;
  place-items: center;
  font-weight: 800
}
#auth-link {
  font-size: 12px;
  color: var(--mute);
  border: 0;
  background: none;
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 170px
}
.email {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap
}
nav#cats {
  max-width: 1180px;
  margin: auto;
  display: flex;
  gap: 20px;
  padding: 0 20px 11px;
  overflow: auto
}
nav#cats button {
  border: 0;
  background: none;
  color: var(--mute);
  font-size: 12.5px;
  white-space: nowrap;
  padding: 3px 0;
  border-bottom: 2px solid transparent
}
nav#cats button.active {
  color: var(--ink);
  font-weight: 700;
  border-bottom-color: var(--accent)
}
.page {
  min-height: 70vh
}
.container {
  max-width: 1180px;
  margin: auto;
  padding: 0 20px
}
.hero {
  position: relative;
  overflow: hidden;
  padding: 74px 20px 66px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--card), var(--surface))
}
.hero:before, .hero:after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(5px);
  pointer-events: none
}
.hero:before {
  width: 260px;
  height: 260px;
  left: 4%;
  top: -110px;
  background: radial-gradient(circle, #f3d4d9, transparent 70%);
  opacity: .7
}
.hero:after {
  width: 300px;
  height: 300px;
  right: 2%;
  bottom: -160px;
  background: radial-gradient(circle, #f1ce9c, transparent 70%);
  opacity: .55
}
.eyebrow {
  position: relative;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-size: 10px;
  color: var(--gold);
  font-weight: 800
}
.hero h1 {
  position: relative;
  font-size: clamp(36px, 7vw, 64px);
  line-height: 1.04;
  margin: 14px 0
}
.hero p {
  position: relative;
  color: var(--mute);
  max-width: 550px;
  margin: 0 auto 25px;
  font-size: 15px;
  line-height: 1.7
}
.btn {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: 700;
  font-size: 13px;
  transition: .2s
}
.btn.primary {
  background: var(--ink);
  color: var(--surface)
}
.btn.gold {
  background: var(--gold);
  color: #241726
}
.btn.ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink)
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 9px 22px rgba(36, 23, 38, .14)
}
.trust {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 28px 0
}
.trust-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  text-align: center
}
.trust-card .icon-wrap {
  margin: auto;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--surface);
  color: var(--gold)
}
.trust-card strong {
  display: block;
  font-size: 12px;
  margin-top: 9px
}
.trust-card span {
  display: block;
  color: var(--mute);
  font-size: 10.5px;
  margin-top: 3px
}
.section {
  padding: 25px 0
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  margin-bottom: 16px
}
.section-head h2 {
  font-size: 22px
}
.muted {
  color: var(--mute);
  font-size: 12px
}
.cat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px
}
.cat-tile {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 14px;
  padding: 15px 8px;
  text-align: center
}
.cat-tile:hover, .cat-tile.active {
  border-color: var(--gold);
  box-shadow: var(--shadow);
  transform: translateY(-2px)
}
.cat-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: auto auto 8px;
  background: var(--surface);
  color: var(--gold)
}
.cat-tile span {
  font-size: 11px;
  font-weight: 700
}
.shop-toolbar {
  display: flex;
  gap: 9px;
  align-items: center;
  margin-bottom: 16px
}
.search {
  position: relative;
  flex: 1
}
.search .icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gold)
}
.search input, .toolbar-select {
  width: 100%;
  padding: 12px 13px 12px 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  outline: none
}
.toolbar-select {
  width: auto;
  padding: 12px 34px 12px 12px
}
.search input:focus, .toolbar-select:focus {
  border-color: var(--gold)
}
.search input {
  padding-right: 36px
}
.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
  border: none;
  background: none;
  color: var(--mute);
  cursor: pointer;
  border-radius: 50%
}
.search-clear:hover {
  color: var(--ink);
  background: var(--line)
}
.search-clear[hidden] {
  display: none
}
.search-clear .icon {
  position: static;
  color: inherit;
  transform: none
}
.filter-panel {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 17px
}
.filter-chip {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--mute);
  padding: 7px 10px;
  border-radius: 99px;
  font-size: 11px
}
.filter-chip.active {
  background: var(--ink);
  color: var(--surface);
  border-color: var(--ink)
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(36, 23, 38, .04);
  transition: .25s
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow)
}
.media {
  height: 185px;
  position: relative;
  background: var(--surface)
}
.media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block
}
.badge {
  position: absolute;
  left: 10px;
  top: 10px;
  background: rgba(36, 23, 38, .72);
  color: #fff;
  border-radius: 99px;
  padding: 4px 8px;
  font-size: 9px;
  font-weight: 700
}
.wish {
  position: absolute;
  right: 9px;
  top: 9px;
  border: 0;
  background: rgba(255, 255, 255, .9);
  color: var(--ink);
  width: 31px;
  height: 31px;
  border-radius: 50%;
  display: grid;
  place-items: center
}
.wish.active {
  color: var(--sale)
}
.discount {
  position: absolute;
  right: 9px;
  bottom: 9px;
  background: var(--sale);
  color: #fff;
  padding: 4px 7px;
  border-radius: 5px;
  font-size: 9px;
  font-weight: 800
}
.card-body {
  padding: 13px
}
.card h3 {
  font-size: 15px;
  margin: 0 0 3px
}
.card .cat {
  font-size: 10.5px;
  color: var(--mute)
}
.rating-line {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 8px 0;
  font-size: 10px
}
.stars {
  letter-spacing: 1px;
  color: var(--gold)
}
.price-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px
}
.price {
  font-size: 14px;
  font-weight: 800
}
.was {
  text-decoration: line-through;
  color: var(--mute);
  font-size: 10px;
  margin-right: 3px
}
.card-actions {
  display: flex;
  gap: 7px;
  margin-top: 10px
}
.card-actions .btn {
  flex: 1;
  padding: 8px 7px;
  font-size: 10.5px
}
.product-page {
  padding: 30px 0 70px
}
.back {
  border: 0;
  background: none;
  color: var(--mute);
  font-size: 12px;
  padding: 0 0 16px;
  display: flex;
  gap: 6px;
  align-items: center
}
.product-hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px
}
.product-image {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden
}
.product-image img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover
}
.product-info h1 {
  font-size: 34px;
  margin: 5px 0 8px
}
.product-info .lead {
  color: var(--mute);
  line-height: 1.7;
  font-size: 14px
}
.meta-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 15px 0
}
.pill {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 99px;
  padding: 6px 9px;
  font-size: 10px;
  color: var(--mute)
}
.big-rating {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 14px 0
}
.big-rating .stars {
  font-size: 18px
}
.product-price {
  font-size: 23px;
  font-weight: 800
}
.product-actions {
  display: flex;
  gap: 9px;
  margin: 18px 0
}
.product-actions .btn {
  flex: 1
}
.assurance {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 20px
}
.assurance div {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  font-size: 10px;
  color: var(--mute);
  display: flex;
  gap: 7px;
  align-items: center
}
.detail-card {
  margin-top: 28px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px
}
.detail-card h2 {
  font-size: 19px;
  margin-bottom: 10px
}
.detail-card p {
  font-size: 13px;
  line-height: 1.7;
  color: var(--mute)
}
.review-form {
  display: grid;
  gap: 9px
}
.review-form input, .review-form textarea {
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px;
  background: var(--surface);
  color: var(--ink)
}
.review-stars {
  display: flex;
  gap: 4px
}
.review-stars button {
  border: 0;
  background: none;
  color: var(--mute);
  font-size: 21px;
  padding: 2px
}
.review-stars button.active {
  color: var(--gold)
}
.review-list {
  display: grid;
  gap: 12px;
  margin-top: 18px
}
.review {
  border-top: 1px solid var(--line);
  padding-top: 12px
}
.review-head {
  display: flex;
  justify-content: space-between;
  font-size: 11px
}
.review p {
  font-size: 12px;
  color: var(--mute);
  line-height: 1.6;
  margin: 6px 0
}
.cart-page {
  padding: 32px 0 70px
}
.cart-layout {
  display: grid;
  grid-template-columns: 1.5fr .8fr;
  gap: 24px
}
.cart-items, .summary {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px
}
.cart-row {
  display: grid;
  grid-template-columns: 70px 1fr auto;
  gap: 12px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding: 12px 0
}
.cart-row:last-child {
  border-bottom: 0
}
.cart-row img {
  width: 70px;
  height: 70px;
  border-radius: 10px;
  object-fit: cover
}
.cart-row h3 {
  font-size: 14px;
  margin: 0 0 3px
}
.cart-row p {
  margin: 0;
  color: var(--mute);
  font-size: 11px
}
.qty {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px
}
.qty button {
  width: 26px;
  height: 26px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: transparent;
  color: var(--ink)
}
.summary {
  height: max-content;
  position: sticky;
  top: 130px
}
.summary h2 {
  font-size: 19px
}
.sumline {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  color: var(--mute);
  font-size: 12px
}
.sumline.total {
  border-top: 1px solid var(--line);
  margin-top: 7px;
  padding-top: 14px;
  color: var(--ink);
  font-weight: 800;
  font-size: 16px
}
.summary .btn {
  width: 100%;
  margin-top: 8px
}
.empty {
  text-align: center;
  padding: 50px 20px;
  color: var(--mute);
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: 16px
}
.empty .icon {
  width: 32px;
  height: 32px;
  margin-bottom: 10px
}
.info-strip {
  margin: 20px 0;
  padding: 14px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  display: flex;
  gap: 10px;
  align-items: flex-start
}
.info-strip strong {
  font-size: 12px
}
.info-strip span {
  display: block;
  color: var(--mute);
  font-size: 10.5px;
  margin-top: 3px;
  line-height: 1.5
}
footer {
  border-top: 1px solid var(--line);
  padding: 35px 20px;
  color: var(--mute);
  font-size: 11px
}
.footer-inner {
  max-width: 1180px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px
}
.footer-brand {
  font-family: Georgia, serif;
  color: var(--ink);
  font-size: 17px
}
.footer-col strong {
  display: block;
  color: var(--ink);
  margin-bottom: 8px
}
.footer-col span {
  display: block;
  margin: 5px 0
}
.fab {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 40;
  border: 0;
  background: var(--ink);
  color: var(--surface);
  padding: 11px 14px;
  border-radius: 99px;
  display: flex;
  gap: 7px;
  align-items: center;
  box-shadow: 0 10px 25px rgba(36, 23, 38, .25);
  font-size: 11px;
  font-weight: 700
}
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(36, 23, 38, .5);
  display: grid;
  place-items: center;
  padding: 12px;
  overflow: auto
}
.modal-box {
  width: min(520px, calc(100vw - 24px));
  min-width: 0;
  max-width: 520px;
  max-height: calc(100dvh - 24px);
  overflow: auto;
  overflow-x: hidden;
  background: var(--card);
  border-radius: 18px;
  padding: 24px;
  position: relative;
  box-shadow: 0 25px 70px rgba(0, 0, 0, .25)
}
.modal-close {
  position: absolute;
  right: 13px;
  top: 13px;
  border: 0;
  background: none;
  color: var(--mute)
}
.modal h2 {
  font-size: 21px;
  margin: 0 0 5px
}
.modal p {
  font-size: 12px;
  color: var(--mute);
  line-height: 1.6
}
.field {
  display: grid;
  gap: 5px;
  margin: 11px 0;
  min-width: 0
}
.field label {
  font-size: 10px;
  color: var(--mute);
  font-weight: 700
}
.field input, .field textarea {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  padding: 11px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 8px;
  box-sizing: border-box;
  outline: none
}
.field input:focus, .field textarea:focus {
  border-color: var(--gold)
}
.card-field {
  position: relative
}
.card-input-wrap {
  position: relative
}
.card-input-wrap input {
  padding-right: 78px
}
.card-brand {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 54px;
  height: 32px;
  display: grid;
  place-items: center;
  pointer-events: none
}
.card-brand svg {
  width: 52px;
  height: 30px;
  display: block
}
.card-brand.is-hidden {
  display: none
}
.card-status {
  min-height: 15px;
  margin-top: 3px;
  font-size: 10px
}
.card-status.valid {
  color: #2d8a57

            },
            body: JSON.stringify(
              {
                name: n,
                email: em,
                address: ad,
                cardNumber: cardNo,
                expiryDate: expiry,
                securityCode: cvv,
                zip: z,
                subtotal: subtotalBeforePromo,
                promoCode: promoPercent() ? promo : null,
                discount: discountFor(subtotalBeforePromo),
                total: total,
                items: items
              }
            )
          }
        )
        .then(
          function (r)
          {
            return r.json()
            .then(
              function (d)
              {
                return {
                  ok: r.ok,
                  data: d
                };
              }
            );
          }
        )
        .then(
          function (x)
          {
            if (!x.ok || !x.data.ok)
            throw new Error(
              x.data.error || "Order could not be sent"
            );
            cart = {
            };
            save(
              "mv_cart",
              cart
            );
            promo = null;
            save(
              "mv_promo",
              null
            );
            save(
              LAST_ORDER_EMAIL_KEY,
              em
            );
            clearCheckoutDraft();
            go("order-confirmation");
          }
        )
        .catch(
          function (e)
          {
            er.textContent = "Almost there! We couldn’t complete your order just yet. Please try again.";
            btn.disabled = false;
            btn.textContent = "Place order";
          }
        );
      };
    }
    document.addEventListener(
      "click",
      function (e)
      {
        var t = e.target.closest("[data-action]");
        if (!t)
        return;
        var a = t.getAttribute("data-action"),
        id = t.getAttribute("data-id");
        if (a === "home")
        {
          go("home");
        }
        else if (a === "shop")
        {
          filter = "All";
          go("home");
          setTimeout(
            function ()
            {
              document.getElementById("collection")
              .scrollIntoView(
                {
                  behavior: "smooth"
                }
              );
            },
            30
          );
        }
        else if (a === "cat")
        {
          filter = t.getAttribute("data-cat");
          if (
            filter === "Wishlist" && wishlist.length === 0
          )
          toast("Your wishlist is empty");
          if (path() !== "home")
          go("home");
          else {
            render();
            setTimeout(
              function ()
              {
                document.getElementById("collection")
                ?.scrollIntoView(
                  {
                    behavior: "smooth"
                  }
                );
              },
              20
            );
          }
        }
        else if (a === "product")
        {
          go("product/" + id);
        }
        else if (a === "add")
        {
          add(id);
        }
        else if (a === "wish")
        {
          wish(id);
        }
        else if (a === "qty")
        {
          changeQty(
            id,
            Number(t.getAttribute("data-delta"))
          );
        }
        else if (a === "remove")
        {
          delete cart[
            id
          ];
          save(
            "mv_cart",
            cart
          );
          render();
        }
        else if (a === "checkout")
        {
          go("checkout");
        }
        else if (a === "promo-apply")
        {
          var pin = document.getElementById("promo-input"),
          code = pin ? pin.value.trim()
          .toUpperCase()
          : "";
          if (!code)
          return toast("Enter a promo code");
          if (!PROMO_CODES[code])
          return toast("That promo code isn't valid");
          promo = code;
          save(
            "mv_promo",
            promo
          );
          render();
          toast("Promo code applied");
        }
        else if (a === "promo-remove")
        {
          promo = null;
          save(
            "mv_promo",
            null
          );
          render();
          toast("Promo code removed");
        }
        else if (a === "back")
        {
          history.length > 1 ? history.back()
          : go("home");
        }
        else if (a === "clear")
        {
          filter = "All";
          query = "";
          render();
          setTimeout(
            function ()
            {
              document.getElementById("collection")
              .scrollIntoView(
                {
                  behavior: "smooth"
                }
              );
            },
            20
          );
        }
        else if (a === "rate")
        {
          reviewRating = Number(t.getAttribute("data-rating"));
          document.querySelectorAll("#review-stars button")
          .forEach(
            function (b)
            {
              b.classList.toggle(
                "active",
                Number(b.dataset.rating)
                <= reviewRating
              );
            }
          );
        }
        else if (a === "review")
        {
          var name = document.getElementById("review-name")
          .value.trim(),
          text = document.getElementById("review-text")
          .value.trim();
          if (!text)
          return toast("Write a comment first");
          if (
            !reviews[
              id
            ]
          )
          reviews[
            id
          ]
          = [
          ];
          reviews[
            id
          ]
          .push(
            {
              name: name || "Verified customer",
              text: text,
              rating: reviewRating,
              date: new Date()
              .toISOString()
            }
          );
          save(
            "mv_reviews",
            reviews
          );
          reviewRating = 5;
          render();
          toast("Review posted");
        }
        ;
      }
    );
    document.getElementById("cart-icon")
    .onclick = function ()
    {
      go("cart");
    };
    document.getElementById("auth-link")
    .onclick = openLogin;
    document.getElementById("theme-btn")
    .onclick = function ()
    {
      var d = document.documentElement;
      var dark = d.getAttribute("data-theme")
      === "dark";
      d.setAttribute(
        "data-theme",
        dark ? "light" : "dark"
      );
      save(
        "mv_theme",
        dark ? "light" : "dark"
      );
      renderHeader();
    };
    document.getElementById("feedback-fab")
    .onclick = feedback;
    var savedTheme = load(
      "mv_theme",
      "light"
    );
    document.documentElement.setAttribute(
      "data-theme",
      savedTheme
    );
    window.addEventListener(
      "hashchange",
      render
    );
    window.addEventListener(
      "resize",
      syncTopbarHeight
    );
    render();
  }
);
</script>
</body></html>
